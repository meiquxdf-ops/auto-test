# new-auto-test 开发编排：Server + Frontend + 一台验收 Agent
#
#   cd deploy && make dev        # 一键起（推荐）
#   docker compose up            # 等价
#
# 起来之后：
#   - 前端     http://127.0.0.1:5173  （Vite dev server，/api 反代到 server）
#   - HTTP API http://127.0.0.1:8080
#   - Agent    容器 atest-agent（tag=docker-agent-01）连 server:9800
#              也可在宿主机 `make agent` 再挂一台
#
# 镜像刻意不用 maven:3.9-eclipse-temurin-17：部分嵌套 overlayfs 环境
# 解压该镜像会因 hsperfdata whiteout 报 operation not permitted。
# Server 使用已打包的 jar（先在宿主机 `make build-server`）。
# 若 docker pull 仍失败，把 dockerd 换成 `--storage-driver vfs` 再试。

services:
  server:
    image: eclipse-temurin:17-jre-jammy
    container_name: atest-server
    working_dir: /app
    # atest.http.public-base 会注入为 $ATEST_HTTP_BASE（脚本回传附件的上传地址）。
    # 默认值 http://127.0.0.1:8080 在 agent 容器里指向 agent 自己，脚本 curl 上传必然
    # Connection refused，所以这里显式改成 compose 网络内可达的 http://server:8080。
    # 注意：宿主机 `make agent` 额外挂的 agent 解析不了 server 这个服务名，这类任务
    # 需要在任务 env 里显式给 ATEST_HTTP_BASE=http://127.0.0.1:8080 覆盖（任务 env 优先）。
    command: java -jar /app/atest-server.jar --atest.http.public-base=http://server:8080
    volumes:
      - ../server/target/atest-server.jar:/app/atest-server.jar:ro
      - server-data:/app/data
      # curl/SSH 在线安装的分发目录（atest.agent-dist.dir 默认 ./dist/agent）。
      # 宿主机 `make agent-dist` 会填充；agent 容器构建完也会自动拷一份进来。
      - ../dist/agent:/app/dist/agent:ro
    ports:
      - "8080:8080"   # HTTP API + SSE + H2 console(/h2-console)
      - "9800:9800"   # Agent 长度前缀 TCP
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  frontend:
    image: node:18-alpine
    container_name: atest-frontend
    working_dir: /app
    # vite.config.ts 里 host 是 127.0.0.1，容器内必须用 --host 0.0.0.0 覆盖
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend:/app
      - node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # vite.config.ts 读 VITE_API_BASE 作为 /api 反代目标；容器网络里指向 server 服务
      VITE_API_BASE: http://server:8080
    depends_on:
      - server
    restart: unless-stopped

  # 黑盒验收用的执行机：真实 bash，连 server:9800
  agent:
    image: golang:1.22-alpine
    container_name: atest-agent
    working_dir: /src
    # 注意：折叠块里续行必须与首行同缩进，否则 YAML 会保留换行导致命令被截断
    # 构建产物顺手拷进 /dist-agent（宿主机 ../dist/agent），server 容器由此获得
    # 可通过 /api/agent/binary 分发的 linux/amd64 静态二进制；先写临时名再 mv，
    # 避免 server 撞见半个文件。
    command: >
      sh -c "apk add --no-cache bash >/dev/null &&
      CGO_ENABLED=0 go build -o /tmp/atagent ./cmd/atagent &&
      cp /tmp/atagent /dist-agent/.atagent.tmp &&
      mv /dist-agent/.atagent.tmp /dist-agent/atagent &&
      /tmp/atagent run -server server:9800 -tag docker-agent-01
      -data-dir /data -concurrency 1 -log-level info"
    volumes:
      - ../agent:/src
      - ../dist/agent:/dist-agent
      - agent-data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
  node-modules:
  agent-data:
