server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: atest-server
  # Default profile runs on an embedded H2 file database so the server boots
  # without MySQL. Switch to MySQL with --spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:file:./data/atest;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: atest-pool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}
  # H2 web console 默认关闭：它无认证兜底（sa/空密码）且能执行任意 SQL，跟随 8080 一起
  # 暴露等于开放整库读写。本地开发确需直查库时，临时显式开启再起 Server：
  #   java -jar atest-server.jar --spring.h2.console.enabled=true
  # 或环境变量 SPRING_H2_CONSOLE_ENABLED=true；用完即关，不要在共享/生产环境开启。
  h2:
    console:
      enabled: false
      path: /h2-console
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      # 附件单文件硬上限 32MB：容器边收边计数，超限即中止，不会把整个请求吞进堆。
      # max-request-size 略大于单文件上限，留出 multipart 边界/头的开销，
      # 使恰好 32MB 的合法文件不会被整包大小误杀。
      max-file-size: 32MB
      max-request-size: 33MB
  jackson:
    # keep nulls in REST payloads so the UI always sees the same field set
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

atest:
  agent:
    port: 9800
    bind-address: 0.0.0.0
    # single TCP frame hard limit (protocol: <= 1MiB)
    max-frame-bytes: 1048576
    # dup_session arbitration: ping the incumbent connection and wait this long
    dup-session-ping-timeout-ms: 5000
    # a connection with no frame for this long is closed
    idle-timeout-sec: 90
    request-timeout-ms: 10000
  # curl / SSH 在线安装用的 atagent 分发目录（linux/amd64 静态编译产物）。
  # 打包 / 编排时把二进制拷进来：cd deploy && make agent-dist（写到 <仓库根>/dist/agent/atagent）。
  # 目录里没有时 Server 还会依次尝试 ../dist/agent/atagent、../agent/atagent（源码仓库开发布局）。
  agent-dist:
    dir: ./dist/agent
  # 「SSH 代装」：Server SSH 到目标机上传 atagent + install.sh 并执行。
  # 口令 / 私钥只在单次请求内存中使用，不落库、不打日志。
  # enabled 默认 false（kill switch）：该接口收 root 凭据并在目标机执行脚本，而第一期
  # HTTP 面没有鉴权，默认开启等于把内网 root 执行面暴露给任何能访问 :8080 的调用方。
  # 确要使用页面「SSH 代装」时改成 true 并重启 Server；关闭期间接口返回 403
  # （code=ssh_install_disabled），复制命令 / curl 一行安装不受影响。
  ssh-install:
    enabled: false
    connect-timeout-ms: 10000
    auth-timeout-ms: 10000
    exec-timeout-ms: 180000
    output-tail-lines: 200
    known-hosts-file: ./data/ssh-known-hosts
  concurrency:
    default-value: 1
    max-value: 4
  logs:
    # per-execution tail cap, older lines are dropped and truncated=true is reported
    max-bytes-per-execution: 5242880
    trim-batch-size: 500
    max-page-size: 5000
  dispatch:
    interval-ms: 1000
    lease-sec: 45
    reconcile-interval-ms: 5000
    # extra grace before the server kills an execution that blew its timeoutSec
    timeout-grace-sec: 15
    # a disconnected (running) execution becomes exception after this long, 0 disables
    disconnected-timeout-sec: 3600
    default-timeout-sec: 3600
  sse:
    queue-capacity: 2000
    heartbeat-ms: 15000
    emitter-timeout-ms: 0
  # 任务终态回调（开放 API）：任务 finished/canceled 后向 callbackUrl POST 一次结果，
  # 2xx 算成功；失败按 1s/2s/4s/8s/16s 退避重试 5 次（连首发共 max-attempts 次）后置 failed。
  # 注意这只重试 HTTP 通知本身，绝不会重跑 shell 命令。
  callback:
    # SSRF 防护白名单：条目可以是主机名、IP 或 CIDR（如 cb.chaos.internal、10.9.0.0/16）。
    # - 留空（默认）：允许一般公网 http(s) 回调，但一律拒绝 loopback、RFC1918 内网、
    #   link-local（含 169.254.169.254 云元数据）、CGNAT、IPv6 ULA 等受保护地址；
    # - 非空：只允许名单内的主机 —— 内网回调接收方（如 Chaos）必须显式列进来。
    # 校验在创建任务（400）和每次投递前都会执行；回调不跟随 3xx 重定向（重定向按失败处理）。
    # 示例：
    # allowed-hosts:
    #   - cb.chaos.internal
    #   - 10.9.0.0/16
    allowed-hosts: []
    max-attempts: 6
    backoff-base-ms: 1000
    timeout-ms: 10000
    sweep-interval-ms: 30000
  # 附件：脚本用 $ATEST_HTTP_BASE POST 回 Server，落 Server 本地磁盘（不是对象存储）。
  # 单文件硬上限 32MB；落盘走专用有界线程池，超出准入水位（max-concurrent + queue-capacity）
  # 的上传直接 429，磁盘/IO 故障 503，绝不把 Tomcat 请求线程压在磁盘 I/O 上。
  attachments:
    dir: ./data/attachments
    max-bytes: 33554432
    max-concurrent: 8
    queue-capacity: 8
  # 注入到每次下发 env 的 ATEST_HTTP_BASE：Agent 上的脚本用它回传附件。
  # 多机部署时必须改成 Agent 能路由到的 Server 地址（如 http://10.0.0.5:8080）。
  http:
    public-base: http://127.0.0.1:8080

logging:
  level:
    com.atest: INFO
    # SSH 代装的会话细节不进日志（防止把认证过程打出来），只留告警
    org.apache.sshd: WARN

---
# mysql profile：连接信息全部来自环境变量，凭据不进 yaml / 不进 git。
#   MYSQL_HOST（默认 127.0.0.1）/ MYSQL_PORT（默认 3306）/ MYSQL_DATABASE（默认 atest）
#   MYSQL_USER（默认 root）/ MYSQL_PASSWORD（无默认，生产必须显式提供）
# systemd 部署放 /etc/atserver/server.env（见 deploy/README.md「装 Server」）。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:atest}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
